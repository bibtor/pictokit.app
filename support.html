<!DOCTYPE html>
<html lang="en" data-color-scheme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support — PictoKit</title>
  <meta name="description" content="Send a message to the PictoKit team. Report a bug, request a feature, or share feedback." />
  <meta name="robots" content="noindex" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Support — PictoKit" />
  <meta property="og:description" content="Send a message to the PictoKit team." />
  <meta property="og:url" content="https://pictokit.app/support" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Support — PictoKit" />
  <meta name="twitter:description" content="Send a message to the PictoKit team." />

  <link rel="canonical" href="https://pictokit.app/support" />
  <link rel="icon" type="image/png" href="public/favicon.png" />
  <link rel="apple-touch-icon" href="public/app-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script src="https://cdn.telemetrydeck.com/websdk/telemetrydeck.min.js" data-app-id="55E41A46-A1D5-4F94-86EB-19D58E58444E"></script>

  <style>
    :root {
      --bg-base: #171615;
      --bg-raised: #1e1d1c;
      --bg-field: #242322;
      --fg-primary: #d6d5d4;
      --fg-secondary: #d6d5d4a6;
      --fg-tertiary: #d6d5d480;
      --fg-disabled: #d6d5d433;
      --accent: #60a5fa;
      --accent-hover: #3b82f6;
      --success: #4ade80;
      --error: #f87171;
      --border-soft: #d6d5d412;
      --border-medium: #d6d5d424;
      --nav-bg-scrolled: rgba(23, 22, 21, 0.75);
      --nav-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-full: 9999px;
      --ease-out-cubic: cubic-bezier(.33, 1, .68, 1);
    }

    @media (prefers-color-scheme: light) {
      :root:not([data-color-scheme="dark"]) {
        --bg-base: #faf8f5;
        --bg-raised: #fdfbfa;
        --bg-field: #ffffff;
        --fg-primary: #27251e;
        --fg-secondary: #27251ea6;
        --fg-tertiary: #27251e80;
        --fg-disabled: #27251e33;
        --accent: #2563eb;
        --accent-hover: #1d4ed8;
        --border-soft: #271a0012;
        --border-medium: #271a0024;
        --nav-bg-scrolled: rgba(253, 251, 250, 0.75);
        --nav-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      }
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 16px;
      font-weight: 400;
      line-height: 1.5;
      background-color: var(--bg-base);
      color: var(--fg-primary);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }

    .top-bar {
      position: fixed;
      top: 32px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      align-items: center;
      padding: 12px 24px;
      width: calc(100% - 32px);
      max-width: 1100px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius-full);
      transition:
        background 0.3s var(--ease-out-cubic),
        border-color 0.3s var(--ease-out-cubic),
        box-shadow 0.3s var(--ease-out-cubic);
    }

    .top-bar.scrolled {
      background: var(--nav-bg-scrolled);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-color: var(--border-soft);
      box-shadow: var(--nav-shadow);
    }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 16px;
      text-decoration: none;
      color: var(--fg-primary);
    }
    .top-bar-left:hover { text-decoration: none; }

    .top-bar-icon {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-lg);
    }

    .top-bar-name {
      font-size: 20px;
      font-weight: 550;
    }

    .support-content {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 140px 24px 0;
      flex: 1;
    }

    .support-content h1 {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .support-content .lede {
      font-size: 15px;
      color: var(--fg-secondary);
      margin-bottom: 32px;
    }

    .form-card {
      background: var(--bg-raised);
      border: 1px solid var(--border-soft);
      border-radius: 22px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--fg-secondary);
      margin-bottom: 6px;
    }

    textarea,
    input[type="email"] {
      width: 100%;
      font-family: inherit;
      font-size: 14px;
      color: var(--fg-primary);
      background: var(--bg-field);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-lg);
      padding: 10px 12px;
      outline: none;
      transition: border-color 0.2s var(--ease-out-cubic);
    }

    textarea {
      min-height: 140px;
      resize: vertical;
      line-height: 1.5;
    }

    textarea:focus,
    input[type="email"]:focus {
      border-color: var(--fg-primary);
    }

    .char-count {
      font-size: 12px;
      color: var(--fg-tertiary);
      text-align: right;
      margin-top: 4px;
    }

    .char-count.over { color: var(--error); }

    .reply-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
      padding: 6px 0;
    }

    .reply-toggle input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border: 1px solid var(--border-medium);
      border-radius: 5px;
      background: var(--bg-field);
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
      transition: background 0.15s var(--ease-out-cubic), border-color 0.15s var(--ease-out-cubic);
    }

    .reply-toggle input[type="checkbox"]:checked {
      background: var(--fg-primary);
      border-color: var(--fg-primary);
    }

    .reply-toggle input[type="checkbox"]:checked::after {
      content: "";
      position: absolute;
      left: 5px;
      top: 1px;
      width: 5px;
      height: 10px;
      border: solid var(--bg-base);
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .reply-toggle-label {
      font-size: 14px;
      color: var(--fg-primary);
    }

    .reply-toggle-hint {
      font-size: 12px;
      color: var(--fg-tertiary);
    }

    .email-field {
      display: none;
    }

    .email-field.show {
      display: block;
    }

    .honeypot {
      position: absolute;
      left: -10000px;
      top: auto;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 4px;
      min-height: 36px;
    }

    .status {
      font-size: 13px;
      flex: 1;
    }
    .status.success { color: var(--success); }
    .status.error { color: var(--error); }

    .submit-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      color: #171615;
      background: #D6D5D4;
      border: none;
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: background 0.2s var(--ease-out-cubic);
      min-width: 84px;
    }

    .submit-btn:hover:not(:disabled) {
      background: #ffffff;
      color: #171615;
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(23, 22, 21, 0.3);
      border-top-color: #171615;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    footer {
      text-align: center;
      padding: 16px 24px;
      border-top: 1px solid var(--border-soft);
      font-size: 13px;
      color: var(--fg-tertiary);
      margin-top: 40px;
    }

    footer a {
      color: var(--fg-secondary);
      text-decoration: none;
      transition: color 0.2s var(--ease-out-cubic);
    }

    footer a:hover {
      color: var(--fg-primary);
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 8px 20px;
    }

    @media (max-width: 600px) {
      .top-bar {
        top: 12px;
        padding: 8px 16px;
        width: calc(100% - 24px);
      }

      .top-bar-icon {
        width: 36px;
        height: 36px;
      }

      .top-bar-name {
        font-size: 15px;
      }

      .support-content {
        padding: 120px 16px 0;
      }

      .support-content h1 {
        font-size: 26px;
      }
    }
  </style>
</head>
<body>
  <nav class="top-bar">
    <a href="index.html" class="top-bar-left">
      <img src="public/pictokitappicon.png" alt="PictoKit icon" class="top-bar-icon" />
      <span class="top-bar-name">PictoKit</span>
    </a>
  </nav>

  <main class="support-content">
    <h1>Support</h1>
    <p class="lede">Write your message here, I read all of them. Feedback, ideas, request, bugs, or just say hi, everything is welcome.</p>

    <form class="form-card" id="support-form" novalidate>
      <div>
        <textarea id="message" name="message" maxlength="3500" required placeholder="Your message..." aria-label="Your message"></textarea>
        <div class="char-count" id="char-count">0 / 3500</div>
      </div>

      <label class="reply-toggle" for="wants-reply">
        <input type="checkbox" id="wants-reply" name="wantsReply" />
        <span class="reply-toggle-label">I want a reply</span>
        <span class="reply-toggle-hint">(I only use your email to respond.)</span>
      </label>

      <div class="email-field" id="email-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" maxlength="254" autocomplete="email" inputmode="email" placeholder="you@example.com" />
      </div>

      <!-- Honeypot: real users never fill this. -->
      <div class="honeypot" aria-hidden="true">
        <label for="company">Company</label>
        <input type="text" id="company" name="company" tabindex="-1" autocomplete="off" />
      </div>

      <div class="actions">
        <div class="status" id="status" role="status" aria-live="polite"></div>
        <button type="submit" class="submit-btn" id="submit-btn">Send</button>
      </div>
    </form>
  </main>

  <footer>
    <div class="footer-links">
      <a href="privacy.html">Privacy Policy</a>
      <a href="/support">Support</a>
      <span>Created by <a href="https://www.charlesbinet.com" target="_blank" rel="noopener">Charles</a></span>
    </div>
  </footer>

  <script>
    (function () {
      var topBar = document.querySelector(".top-bar");
      window.addEventListener("scroll", function () {
        topBar.classList.toggle("scrolled", window.scrollY > 50);
      });

      var form = document.getElementById("support-form");
      var message = document.getElementById("message");
      var charCount = document.getElementById("char-count");
      var wantsReply = document.getElementById("wants-reply");
      var emailField = document.getElementById("email-field");
      var emailInput = document.getElementById("email");
      var company = document.getElementById("company");
      var submitBtn = document.getElementById("submit-btn");
      var status = document.getElementById("status");

      message.addEventListener("input", function () {
        var len = message.value.length;
        charCount.textContent = len + " / 3500";
        charCount.classList.toggle("over", len > 3500);
      });

      wantsReply.addEventListener("change", function () {
        if (wantsReply.checked) {
          emailField.classList.add("show");
          setTimeout(function () { emailInput.focus(); }, 0);
        } else {
          emailField.classList.remove("show");
          emailInput.value = "";
        }
      });

      function setStatus(text, kind) {
        status.textContent = text;
        status.classList.remove("success", "error");
        if (kind) status.classList.add(kind);
      }

      function setSubmitLoading(loading) {
        submitBtn.disabled = loading;
        submitBtn.innerHTML = loading ? '<span class="spinner"></span>' : "Send";
      }

      function trackEvent(hasEmail) {
        try {
          var payload = [{
            appID: "55E41A46-A1D5-4F94-86EB-19D58E58444E",
            type: "supportFormSubmitted",
            payload: ["hasEmail:" + hasEmail],
            isTestMode: location.hostname === "localhost" || location.hostname === "127.0.0.1"
          }];
          navigator.sendBeacon("https://nom.telemetrydeck.com/v2/", JSON.stringify(payload));
        } catch (e) {}
      }

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        var msg = message.value.trim();
        if (!msg) {
          setStatus("Please write a message.", "error");
          message.focus();
          return;
        }
        if (msg.length > 3500) {
          setStatus("Message is too long.", "error");
          return;
        }

        var payload = {
          message: msg,
          wantsReply: wantsReply.checked,
          company: company.value
        };

        if (wantsReply.checked) {
          var emailVal = emailInput.value.trim();
          var emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailVal) && emailVal.length <= 254;
          if (!emailOk) {
            setStatus("Please enter a valid email address.", "error");
            emailInput.focus();
            return;
          }
          payload.email = emailVal;
        }

        setStatus("");
        setSubmitLoading(true);

        try {
          var res = await fetch("/api/support", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          if (res.ok) {
            trackEvent(wantsReply.checked);
            setStatus("Sent! ✓", "success");
            form.reset();
            charCount.textContent = "0 / 3500";
            emailField.classList.remove("show");
            setTimeout(function () { setStatus(""); }, 4000);
          } else if (res.status === 429) {
            setStatus("Too many messages from this address. Please try again later.", "error");
          } else {
            setStatus("Failed to send. Try again.", "error");
          }
        } catch {
          setStatus("Network error. Try again.", "error");
        } finally {
          setSubmitLoading(false);
        }
      });
    })();
  </script>
</body>
</html>
